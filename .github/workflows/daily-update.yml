name: Daily catalog update

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Discover and organize components
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
        run: python3 scripts/update_catalog.py
      - name: Validate data and site
        run: |
          python3 scripts/validate_catalog.py
          npm ci
          npm run build
      - name: Open update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          branch="bot/catalog-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "ai-baibaoxiang-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch"
          git add data/catalog.json data/sync-state.json data/update-report.json
          git commit -m "content: update component catalog"
          git push origin "$branch"
          pr=$(gh pr create --title "content: 每日组件更新" --body "自动发现、整理并校验的新组件。所有新增内容先标记为待确认。" --base main --head "$branch")
          gh pr merge --auto --squash "$pr"
