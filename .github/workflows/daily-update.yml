name: Daily catalog update

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Discover up to three reviewable components
        env:
          MAX_NEW_COMPONENTS: "3"
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_EDITORIAL_ENDPOINT: ${{ vars.CLOUDFLARE_EDITORIAL_ENDPOINT }}
          EDITORIAL_API_TOKEN: ${{ secrets.EDITORIAL_API_TOKEN }}
        run: python3 scripts/update_catalog.py
      - name: Validate data and site
        run: |
          python3 scripts/validate_catalog.py
          npm ci
          npm run build
      - name: Publish validated update
        run: |
          git diff --quiet && exit 0
          git config user.name "ai-baibaoxiang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json data/sync-state.json data/update-report.json
          git commit -m "content: update component catalog"
          git push origin HEAD:main
